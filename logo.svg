<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Barton: Kullevi's mark inside a yard, a rounded square with a gate open on the left
       (a barton in Moon's books is the yard where yeomen drill and are tested).
       Girdish's ring opens at the top, Kuakgan's at the bottom. -->
  <style>g { color: #0f9d6b } @media (prefers-color-scheme: dark) { g { color: #2fd08b } }</style>
  <g fill="currentColor">
    <path d="M42,23.09 A30,30 0 1 0 58,23.09 L58,40 A8,8 0 0 1 42,40 Z" transform="translate(50 50) scale(.56) translate(-50 -52)"/>
    <path d="M14,35 V34 A20,20 0 0 1 34,14 H66 A20,20 0 0 1 86,34 V66 A20,20 0 0 1 66,86 H34 A20,20 0 0 1 14,66 V65" fill="none" stroke="currentColor" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
