<!doctype html>
<!-- Barton-eval results page: `barton report` fills in the data below and opens
     this file. No server and no libraries. The result is drawn as one landscape
     dashboard on a canvas that fills the window and lays itself out for its
     size, 2:1 by default; Copy image and Save PNG draw the same dashboard at
     the window's size and at least twice its resolution. Visual system shared with Kuakgan (its dashboard.html
     :root): tokens, type scale 12/14/16/20/28/48, 8 px grid, series palette. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Barton results</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cstyle%3Eg %7B color: #0f9d6b %7D %40media (prefers-color-scheme: dark) %7B g %7B color: #2fd08b %7D %7D%3C/style%3E%3Cg fill='currentColor'%3E%3Cpath d='M42,23.09 A30,30 0 1 0 58,23.09 L58,40 A8,8 0 0 1 42,40 Z' transform='translate(50 59) scale(.62) translate(-50 -52)'/%3E%3Cpath d='M37,89 H11 V45 L50,9 L89,45 V89 H63' fill='none' stroke='currentColor' stroke-width='10' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/g%3E%3C/svg%3E">
<style>
:root {
  --bg:#f6f7f9; --surface:#ffffff; --border:#e6e8ec; --track:#eef0f3; --text:#111418; --muted:#5d6673;
  --faint:#8b929d; --accent:#0f9d6b; --warn:#c27a12; --err:#d0453b;
  --font:"Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",sans-serif;
}
:root[data-theme="dark"] { --bg:#0d1014; --surface:#151a20; --border:#252c35; --track:#1e242c; --text:#eef1f4; --muted:#8b95a3; --faint:#677180; --accent:#2fd08b; --warn:#e0a043; --err:#f0675c; }
* { box-sizing:border-box; }
html, body { margin:0; background:var(--bg); color:var(--text); font:14px/1.5 var(--font); }
.bar { display:flex; gap:8px 12px; align-items:center; flex-wrap:wrap; justify-content:flex-end; padding:12px 16px 0; color:var(--muted); }
.bar input { font:inherit; color:var(--text); background:var(--surface); border:1px solid var(--border); border-radius:8px; padding:5px 10px; width:160px; }
.seg { display:inline-flex; background:var(--track); border-radius:8px; padding:2px; }
.seg button, .act { font:inherit; font-weight:600; border:0; background:none; color:var(--muted); padding:5px 12px; border-radius:6px; cursor:pointer; }
.seg button[aria-pressed="true"] { background:var(--surface); color:var(--text); }
.act { background:var(--surface); color:var(--text); border:1px solid var(--border); border-radius:8px; }
.act.primary { background:var(--text); color:var(--surface); border-color:var(--text); }
#wrap { padding:12px 16px 0; }
#dash { display:block; width:100%; }
.below { max-width:1200px; margin:0 auto; padding:32px 16px 48px; }
.meta { color:var(--muted); margin:0 0 24px; }
h2 { font-size:12px; font-weight:600; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); margin:0 0 12px; }
.table { background:var(--surface); border:1px solid var(--border); border-radius:16px; overflow-x:auto; }
table { width:100%; border-collapse:collapse; }
th, td { text-align:left; padding:10px 16px; border-bottom:1px solid var(--border); vertical-align:top; }
tr:last-child td { border-bottom:0; }
th { color:var(--muted); font-weight:600; font-size:12px; text-transform:uppercase; letter-spacing:.06em; white-space:nowrap; }
td small { display:block; color:var(--muted); }
.ok { color:var(--accent); font-weight:650; } .no { color:var(--err); font-weight:650; } .wait { color:var(--muted); }
footer { margin-top:32px; color:var(--muted); }
footer a { color:var(--text); font-weight:600; text-decoration:none; }
</style>
</head>
<body>
<div class="bar">
  <label>Your name <input id="handle" placeholder="@yourname"></label>
  <span class="seg"><button id="hide" aria-pressed="false" title="Show 'My project' instead of the project name, and leave out task descriptions">Hide names</button></span>
  <span class="seg" id="theme" role="group" aria-label="Theme"><button data-v="light">Light</button><button data-v="dark">Dark</button></span>
  <button class="act primary" id="copy">Copy image</button>
  <button class="act" id="save">Save PNG</button>
</div>
<div id="wrap"><canvas id="dash" role="img"></canvas></div>
<div class="below">
  <p class="meta" id="meta"></p>
  <h2>Task by task</h2>
  <div class="table"><table id="tasks"></table></div>
  <footer>Made with <a href="https://github.com/Kullevi/barton-eval">Barton-eval</a>, open source by
    <a href="https://kullevi.com">Kullevi</a>. Results stay on your computer unless you share an image.</footer>
</div>
<script>
const DATA = /*BARTON_DATA*/null;
const THEMES = {
  light: { page: "#f6f7f9", bg: "#ffffff", text: "#111418", muted: "#5d6673", border: "#e6e8ec", track: "#eef0f3", tie: "#c5cbd3", accent: "#0f9d6b",
    series: ["#0f9d6b", "#3b6fe0", "#e0882b", "#8a5cf0", "#e0457b", "#1aa6b8", "#9aa3ad"] },
  dark: { page: "#0d1014", bg: "#151a20", text: "#eef1f4", muted: "#8b95a3", border: "#252c35", track: "#1e242c", tie: "#46505c", accent: "#2fd08b",
    series: ["#2fd08b", "#6b93f0", "#f0a352", "#a585f5", "#f06a95", "#3cc3d4", "#b4bcc5"] },
};
const FONT = '"Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",sans-serif';
const EFFORT_ORDER = ["minimal", "low", "medium", "high", "xhigh", "max", "default"];
const HARNESS = { claude: "Claude Code", codex: "Codex CLI", agy: "Antigravity CLI" };
const LOGO_MARK = new Path2D("M42,23.09 A30,30 0 1 0 58,23.09 L58,40 A8,8 0 0 1 42,40 Z");
const LOGO_HOUSE = new Path2D("M37,89 H11 V45 L50,9 L89,45 V89 H63");
const $ = (id) => document.getElementById(id);

function storeGet(k, d) { try { return localStorage.getItem(k) || d; } catch (e) { return d; } }
function storeSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
// With Hide names on, nothing on the page or the image names the project or describes its code.
const hidden = () => storeGet("barton-hide", "") === "1";
const repoName = () => hidden() ? "My project" : DATA.repo;
const themeName = () => storeGet("barton-theme", "light") === "dark" ? "dark" : "light";

// ---- Data --------------------------------------------------------------

// One colour per model, in order of first appearance, the same on every card.
function modelColors() {
  const order = [...new Set((DATA.results || []).map(r => r.model))];
  return m => Math.min(order.indexOf(m), 6);
}

// One row per model, harness and effort level.
function settings(kind) {
  const rows = (DATA.results || []).filter(r => r.kind === kind && !["error", "pending"].includes(r.outcome));
  const map = new Map();
  for (const r of rows) {
    const effort = r.effort || "default";
    const key = `${r.model}|${r.harness}|${effort}`;
    if (!map.has(key)) map.set(key, { key, model: r.model, harness: r.harness, effort, hits: 0, n: 0, secs: 0, cost: 0,
      costKnown: true, costEst: false, attempts: new Set(), tasks: new Set(), methods: new Set(), other: 0 });
    const s = map.get(key);
    s.n += 1; s.hits += ["solved", "found"].includes(r.outcome) ? 1 : 0;
    s.secs += r.seconds || 0; s.attempts.add(r.attempt); s.tasks.add(r.task); s.methods.add(r.method);
    if (r.cost_usd == null) s.costKnown = false; else s.cost += r.cost_usd;
    if (r.cost_kind === "estimated") s.costEst = true;
    s.other += r.other_findings || 0;
  }
  const list = [...map.values()];
  const efforts = m => new Set(list.filter(s => s.model === m).map(s => s.effort)).size;
  for (const s of list) {
    s.runs = s.attempts.size || 1;
    s.label = s.model + (efforts(s.model) > 1 ? ` (${s.effort})` : "");
    s.tag = efforts(s.model) > 1 ? s.effort : "";
    s.detail = `${s.effort} · ${HARNESS[s.harness] || s.harness}`;
  }
  return list;
}

const plural = (n, w) => `${n} ${w}${n === 1 ? "" : "s"}`;
const fmtMin = s => (s / 60).toFixed(s < 600 ? 1 : 0) + " min";
const fmtUsd = v => "$" + (v > 0 && v < 0.01 ? v.toFixed(3) : v.toFixed(2));
const byRate = (a, b) => b.hits / b.n - a.hits / a.n || a.secs / a.runs - b.secs / b.runs
  || EFFORT_ORDER.indexOf(a.effort) - EFFORT_ORDER.indexOf(b.effort);

function costText(s) {
  if (!s.costKnown) return "cost unknown";
  // What the run would cost at the vendor's API price; on a subscription it uses plan quota instead.
  return "API " + (s.costEst ? "≈" : "") + fmtUsd(s.cost / s.runs);
}

function methodShort(list) {
  const names = { tests: "Project's tests", check: "Check from the original change", judge: "Blind AI judge",
    planted: "Known planted bug", "no change": "No change made" };
  const m = new Set(); list.forEach(s => s.methods.forEach(x => m.add(x)));
  return [...m].map(x => names[x] || x).join(" + ");
}

// A public repository may be in a model's training data, which the card says.
const repoStat = () => ({ label: "Repo", value: DATA.public ? "Public (may be in training data)" : "Private" });

function judgesOf(kind) {
  return [...new Set((DATA.results || []).filter(r => r.kind === kind && r.judge_model).map(r => r.judge_model))];
}

// "Too close to call" when the top two differ by less than two standard errors of
// the difference between two proportions, or by fewer than two tasks.
function closeCall(list) {
  if (list.length < 2) return false;
  const [a, b] = [...list].sort(byRate);
  const pa = a.hits / a.n, pb = b.hits / b.n;
  const se = Math.sqrt(pa * (1 - pa) / a.n + pb * (1 - pb) / b.n);
  return pa - pb < 2 * se || (pa - pb) * Math.min(a.n, b.n) < 2;
}

function scoreSpec(kind, color) {
  const list = settings(kind).sort(byRate);
  if (!list.length) return null;
  const write = kind === "write";
  const n = Math.max(...list.map(s => s.tasks.size));
  const runs = Math.max(...list.map(s => s.runs));
  const top = list[0];
  const all = list.every(s => s.hits === s.n);
  const ceiling = list.length > 1 && list.every(s => s.hits / s.n >= 0.9);
  const verb = write ? "solved" : "found";
  const noun = write ? plural(n, "task") : plural(n, "planted bug");
  const every = list.length === 2 ? "Both models" : "Every model";
  let headline, sub;
  if (list.length === 1) {
    headline = `${top.label} ${verb} ${top.hits} of ${top.n}`;
    sub = write ? `Coding tasks from ${repoName()}, ${top.runs > 1 ? "over " + plural(top.runs, "run") : "one run"}.` : "Code reviews of real changes, each with one planted bug.";
  } else if (ceiling) {
    headline = n === 1 ? `${every} ${verb} the ${write ? "task" : "planted bug"}`
      : all ? `${every} ${verb} all ${noun}` : `${every} ${verb} nearly all ${noun}`;
    sub = "These tasks were too easy to tell the models apart.";
  } else if (closeCall(list)) {
    headline = "Too close to call";
    sub = `${top.label} ${verb} ${top.hits} of ${top.n}, ${list[1].label} ${list[1].hits} of ${list[1].n}: on ${noun}, a gap this small can be chance.`;
  } else {
    headline = `${top.label} ${verb} ${top.hits} of ${top.n}`;
    sub = `Ahead of ${list[1].label} with ${list[1].hits} of ${list[1].n}, on ${write ? "coding tasks" : "code reviews"} from ${repoName()}.`;
  }
  const judges = judgesOf(kind);
  const stats = [
    { label: write ? "Tasks" : "Reviews", value: String(n) },
    { label: "Runs each", value: String(runs) },
    { label: "Scored by", value: methodShort(list) + (judges.length ? ` (${judges.join(", ")})` : "") },
  ];
  if (DATA.public != null) stats.push(repoStat());
  if (!write) {
    const other = list.reduce((a, s) => a + s.other, 0);
    if (other) stats.splice(2, 0, { label: "Other findings", value: String(other) });
  }
  return {
    n, runs, method: methodShort(list), easy: ceiling,
    key: kind + "-score", kicker: write ? "Coding tasks solved" : "Bugs found in code review", headline, sub, stats,
    rows: list.map(s => ({
      name: s.model, tag: s.tag, detail: s.detail, color: color(s.model),
      segs: Array.from({ length: s.n }, (_, i) => i < s.hits ? "w" : "l"),
      value: `${s.hits} / ${s.n}`, note: [fmtMin(s.secs / s.runs) + " model time", costText(s)].filter(Boolean).join(" · "),
    })),
  };
}

// Blind A/B preferences where both solutions passed, counted only when both orders agree.
function qualitySpec(color) {
  const q = DATA.quality || [];
  if (!q.length) return null;
  const list = settings("write").map(s => {
    const segs = [];
    for (const c of q) {
      if (c.a !== s.key && c.b !== s.key) continue;
      segs.push(c.winner === null ? "t" : c.winner === s.key ? "w" : "l");
    }
    segs.sort((a, b) => "wtl".indexOf(a) - "wtl".indexOf(b));
    const k = t => segs.filter(x => x === t).length;
    return { ...s, segs, w: k("w"), t: k("t"), l: k("l") };
  }).filter(s => s.segs.length).sort((a, b) => (b.w - b.l) - (a.w - a.l) || b.w - a.w);
  if (!list.length) return null;
  const top = list[0], next = list[1];
  const clear = next ? (top.w - top.l) - (next.w - next.l) >= 2 : top.w > top.l;
  const judges = DATA.quality_judges || [];
  return {
    n: q.length, runs: 1,
    key: "write-quality", kicker: "Better solution when both passed",
    headline: clear ? `${top.label} wrote the better solution ${top.w} of ${top.segs.length} times` : "No clear winner on quality",
    sub: "A blind AI judge compared solutions that both passed, in both orders.",
    stats: [
      { label: "Comparisons", value: String(q.length) },
      { label: "Judge", value: judges.length ? judges.join(", ") : "Blind AI judge" },
      { label: "A win counts", value: "Only if both orders agree" },
    ],
    rows: list.map(s => ({
      name: s.model, tag: s.tag, detail: s.detail, color: color(s.model), segs: s.segs,
      value: `${s.w} / ${s.segs.length} won`, note: `${s.t} tie · ${s.l} lost`,
    })),
  };
}



// ---- Drawing -----------------------------------------------------------
// One dashboard: brand row, headline result, a main panel with the coding tasks,
// side panels for quality and review, and the numbers behind it in a footer.
// Laid out landscape, 2:1 by default and wider when the window is short; on a narrow window the panels
// stack instead. Every size is a step of the shared type scale times `s`.

const font = (size, weight = 400) => `${weight} ${size}px ${FONT}`;

function setFont(x, size, weight, spacing = 0) {
  x.font = font(size, weight);
  if ("letterSpacing" in x) x.letterSpacing = spacing ? `${spacing}px` : "0px";
}

function ellipsize(x, text, maxW) {
  if (maxW <= 0) return "";
  if (x.measureText(text).width <= maxW) return text;
  while (text.length > 1 && x.measureText(text + "…").width > maxW) text = text.slice(0, -1);
  return text + "…";
}

function roundRect(x, X, Y, w, h, r) {
  r = Math.max(0, Math.min(r, w / 2, h / 2));
  x.beginPath(); x.moveTo(X + r, Y); x.arcTo(X + w, Y, X + w, Y + h, r); x.arcTo(X + w, Y + h, X, Y + h, r);
  x.arcTo(X, Y + h, X, Y, r); x.arcTo(X, Y, X + w, Y, r); x.closePath();
}

function drawLogo(x, X, Y, size, colour) {
  x.save(); x.translate(X, Y); x.scale(size / 100, size / 100);
  x.fillStyle = colour; x.strokeStyle = colour; x.lineWidth = 10; x.lineCap = "round"; x.lineJoin = "round";
  x.save(); x.translate(50, 59); x.scale(.62, .62); x.translate(-50, -52); x.fill(LOGO_MARK); x.restore();
  x.stroke(LOGO_HOUSE); x.restore();
}

// A panel with an uppercase title (and a note on the right); returns its content box.
function drawPanel(x, T, s, X, Y, w, h, title, note) {
  x.fillStyle = T.bg; roundRect(x, X, Y, w, h, 16 * s); x.fill();
  x.strokeStyle = T.border; x.lineWidth = 1; roundRect(x, X + .5, Y + .5, w - 1, h - 1, 16 * s); x.stroke();
  const p = 24 * s, base = Y + p + 10 * s;
  setFont(x, 12 * s, 400); const nw = note ? x.measureText(note).width : 0;
  if (note) { x.fillStyle = T.muted; x.textAlign = "right"; x.fillText(note, X + w - p, base); x.textAlign = "left"; }
  setFont(x, 12 * s, 600, .72 * s); x.fillStyle = T.muted;
  x.fillText(ellipsize(x, title.toUpperCase(), w - 2 * p - nw - 16 * s), X + p, base);
  return { x: X + p, y: Y + p + 28 * s, w: w - 2 * p, h: h - 2 * p - 28 * s };
}

// One block per task (coloured when solved, grey for a tie); a continuous bar when they are too many.
function drawBlocks(x, T, segs, colour, X, Y, w, h) {
  const n = segs.length, fills = { w: colour, t: T.tie, l: T.track };
  const gap = n <= 12 ? Math.max(2, h * .3) : n <= 30 ? 2 : 0;
  if (gap && (w - gap * (n - 1)) / n >= 3) {
    const bw = (w - gap * (n - 1)) / n;
    segs.forEach((v, j) => { x.fillStyle = fills[v]; roundRect(x, X + j * (bw + gap), Y, bw, h, Math.min(h / 3, bw / 3)); x.fill(); });
    return;
  }
  x.save(); roundRect(x, X, Y, w, h, h / 3); x.fillStyle = T.track; x.fill(); x.clip();
  let cx = X;
  for (const v of ["w", "t"]) { const sw = w * segs.filter(k => k === v).length / n; x.fillStyle = fills[v]; x.fillRect(cx, Y, sw, h); cx += sw; }
  x.restore();
}

// Rows of one panel. Large rows carry the effort, harness, time and cost on a second line.
function drawRows(x, T, s, rows, box, large) {
  if (!rows.length) return;
  const minH = (large ? 36 : 15) * s, maxH = (large ? 76 : 40) * s;
  let shown = rows, more = 0;
  if (box.h / rows.length < minH) {
    const k = Math.max(1, Math.floor(box.h / minH) - 1);
    shown = rows.slice(0, k); more = rows.length - k;
  }
  const slots = shown.length + (more ? 1 : 0);
  const rowH = Math.min(maxH, box.h / slots);
  box = { ...box, y: box.y + (box.h - slots * rowH) / 2 };
  const two = large && rowH >= 48 * s;
  // A narrow panel (a phone) gives the names more room and the bars less.
  const narrow = box.w / s < 520;
  const labelW = box.w * (large ? (narrow ? .4 : .3) : (narrow ? .42 : .36)), valueW = box.w * (large ? .22 : .2);
  const barX = box.x + labelW, barW = box.w - labelW - valueW - 16 * s;
  // Compact rows shrink their type with the row, so a panel can show every model.
  const fit = large ? 1 : Math.min(1, rowH / (22 * s));
  const nameSize = (large ? 16 : 14 * fit) * s, valueSize = (large ? 20 : 14 * fit) * s;
  shown.forEach((r, i) => {
    const mid = box.y + i * rowH + rowH / 2, colour = T.series[r.color];
    const ny = two ? mid - 3 * s : mid + nameSize * .35;
    x.fillStyle = colour; x.beginPath(); x.arc(box.x + 5 * s, ny - nameSize * .33, 5 * s, 0, Math.PI * 2); x.fill();
    setFont(x, nameSize, 650); x.fillStyle = T.text;
    const tagW = !two && r.tag ? (setFont(x, (large ? 14 : 12) * s, 400), x.measureText(r.tag).width + 6 * s) : 0;
    setFont(x, nameSize, 650);
    const name = ellipsize(x, r.name, labelW - 28 * s - tagW);
    x.fillText(name, box.x + 18 * s, ny);
    const nameW = x.measureText(name).width;
    setFont(x, (large ? 14 : 12) * s, 400); x.fillStyle = T.muted;
    if (two) x.fillText(ellipsize(x, r.detail, labelW - 28 * s), box.x + 18 * s, mid + 17 * s);
    else if (tagW) x.fillText(r.tag, box.x + 18 * s + nameW + 6 * s, ny);
    const bh = Math.min((large ? 22 : 14) * s, rowH * .42);
    drawBlocks(x, T, r.segs, colour, barX, mid - bh / 2, barW, bh);
    x.textAlign = "right";
    setFont(x, valueSize, 650); x.fillStyle = T.text;
    x.fillText(r.value, box.x + box.w, two ? mid - 1 * s : mid + valueSize * .35);
    // The note may run under the end of the bar, which sits higher, so time and cost both fit.
    if (two && r.note) { setFont(x, 12 * s, 400); x.fillStyle = T.muted; x.fillText(ellipsize(x, r.note, valueW + barW * .6), box.x + box.w, mid + 21 * s); }
    x.textAlign = "left";
  });
  if (more) {
    setFont(x, 12 * s, 400); x.fillStyle = T.muted;
    x.fillText(`+ ${more} more`, box.x + 18 * s, box.y + shown.length * rowH + rowH / 2 + 4 * s);
  }
}

function panelsOf() {
  const color = modelColors();
  const write = scoreSpec("write", color), review = scoreSpec("review", color), quality = qualitySpec(color);
  const main = write || review;
  const side = [write && quality, write && review].filter(Boolean);
  return { main, side, write, review, quality };
}

const noteOf = p => p.key === "write-quality" ? plural(p.n, "comparison")
  : p.easy ? "too easy to tell apart"
  : `${plural(p.n, p.key.startsWith("write") ? "task" : "review")} · ${p.runs === 1 ? "1 run each" : p.runs + " runs each"}`
    + (p.key === "write-score" && p.rows.length > 1 ? ` · ${apartCount()} told apart` : "");
const titleOf = p => p.key === "write-quality" ? "Better solution when both passed"
  : p.key === "write-score" ? "Coding tasks solved" : "Planted bugs found in review";

// Which tasks told the settings apart: every one made it, some did, or none did.
// Only the "some" tasks can show a difference; the others are too easy or too hard here.
// Per setting, the share of its attempts that made it; a task tells settings apart
// only when those shares differ, not when one setting's attempts disagree.
function splitOf(taskId) {
  const by = new Map();
  for (const r of DATA.results || []) {
    if (r.task !== taskId || ["error", "pending"].includes(r.outcome)) continue;
    const k = `${r.model}|${r.harness}|${r.effort || ""}`, s = by.get(k) || [0, 0];
    s[0] += ["solved", "found"].includes(r.outcome) ? 1 : 0; s[1] += 1; by.set(k, s);
  }
  const rates = [...by.values()].map(([h, n]) => h / n);
  if (rates.length < 2) return null;
  if (new Set(rates).size > 1) return "some";
  return rates[0] === 1 ? "all" : rates[0] === 0 ? "none" : null;
}

// How many coding tasks told the settings apart, for the panel's note.
function apartCount() {
  return (DATA.tasks || []).filter(t => t.kind === "write" && splitOf(t.id) === "some").length;
}

// The numbers behind the result, shown once in the footer.
function footerStats(P) {
  const st = [];
  if (P.write) st.push({ label: "Coding tasks", value: String(P.write.n) });
  if (P.review) st.push({ label: "Reviews", value: String(P.review.n) });
  const runs = Math.max(...[P.write, P.review].filter(Boolean).map(p => p.runs));
  st.push({ label: "Runs each", value: String(runs) });
  const by = [P.write, P.review].filter(Boolean).map(p => p.method).filter(Boolean);
  st.push({ label: "Scored by", value: [...new Set(by)].join(" + ") });
  const judges = [...new Set([...judgesOf("write"), ...judgesOf("review"), ...(DATA.quality_judges || [])])];
  if (judges.length) st.push({ label: "AI judge", value: judges.join(", ") });
  if (DATA.public != null) st.push(repoStat());
  return st;
}

// Narrow windows stack the panels; this is the height they need at width w.
function stackedHeight(w, P) {
  const s = Math.min(1, Math.max(.75, w / 520)), pad = 16 * s, gap = 16 * s;
  let h = pad + 28 * s + 104 * s;
  for (const p of [P.main, ...P.side]) h += 76 * s + p.rows.length * (p === P.main ? 56 : 34) * s + gap;
  return h + Math.ceil(footerStats(P).length / 2) * 48 * s + 72 * s + pad;
}

function drawDashboard(c, w, h, T, stacked) {
  const dpr = c._dpr || 1;
  const x = c.getContext("2d");
  x.setTransform(dpr, 0, 0, dpr, 0, 0); x.textBaseline = "alphabetic";
  const P = panelsOf();
  x.fillStyle = T.page; x.fillRect(0, 0, w, h);
  const s = stacked ? Math.min(1, Math.max(.75, w / 520)) : Math.max(.55, Math.min(w / 1200, h / 600, 2.5));
  const pad = (stacked ? 16 : 32) * s, gap = (stacked ? 16 : 24) * s;

  // Brand row.
  drawLogo(x, pad, pad, 28 * s, T.accent);
  setFont(x, 16 * s, 650); x.fillStyle = T.text; x.fillText("Barton-eval", pad + 38 * s, pad + 20 * s);
  const handle = $("handle").value.trim();
  setFont(x, 14 * s, 400); x.fillStyle = T.muted; x.textAlign = "right";
  const where = repoName() + (DATA.quick ? " · quick run" : "");
  x.fillText(ellipsize(x, handle ? `${handle} · ${where}` : where, w / 2 - pad), w - pad, pad + 20 * s); x.textAlign = "left";
  if (!P.main) {
    setFont(x, 20 * s, 400); x.fillStyle = T.muted;
    x.fillText("No scored runs yet. Ask your agent to continue the Barton run.", pad, pad + 96 * s);
    return;
  }

  // Headline result: the largest step of the scale that fits.
  let y = pad + 28 * s + 56 * s;
  for (const size of [48, 40, 36, 28, 24, 20]) {
    setFont(x, size * s, 650, -0.02 * size * s);
    if (x.measureText(P.main.headline).width <= w - 2 * pad || size === 20) break;
  }
  x.fillStyle = T.text; x.fillText(ellipsize(x, P.main.headline, w - 2 * pad), pad, y);
  setFont(x, 16 * s, 400); x.fillStyle = T.muted;
  x.fillText(ellipsize(x, P.main.sub, w - 2 * pad), pad, y + 28 * s);
  const top = y + 56 * s;

  // Footer: stats left, credit right (two columns of stats when stacked).
  const stats = footerStats(P);
  const footH = stacked ? Math.ceil(stats.length / 2) * 48 * s + 56 * s : 48 * s;
  const footY = h - pad - footH;
  x.fillStyle = T.border; x.fillRect(pad, footY - 16 * s, w - 2 * pad, 1);
  const credit = "github.com/Kullevi/barton-eval", by = "RUN WITH BARTON-EVAL · BY KULLEVI";
  setFont(x, 12 * s, 600, .72 * s); const byW = x.measureText(by).width;
  if (stacked) {
    stats.forEach((st, i) => {
      const sx = pad + (i % 2) * (w - 2 * pad) / 2, sy = footY + Math.floor(i / 2) * 48 * s + 12 * s;
      setFont(x, 12 * s, 600, .72 * s); x.fillStyle = T.muted; x.fillText(st.label.toUpperCase(), sx, sy);
      setFont(x, 16 * s, 650); x.fillStyle = T.text; x.fillText(ellipsize(x, st.value, (w - 2 * pad) / 2 - 12 * s), sx, sy + 22 * s);
    });
    setFont(x, 12 * s, 600, .72 * s); x.fillStyle = T.muted; x.fillText(by, pad, h - pad - 22 * s);
    setFont(x, 14 * s, 400); x.fillText(credit, pad, h - pad);
  } else {
    x.textAlign = "right";
    setFont(x, 12 * s, 600, .72 * s); x.fillStyle = T.muted; x.fillText(by, w - pad, footY + 14 * s);
    setFont(x, 14 * s, 400); x.fillText(credit, w - pad, footY + 38 * s);
    x.textAlign = "left";
    let sx = pad; const limit = w - pad - byW - 32 * s;
    for (const st of stats) {
      setFont(x, 16 * s, 650); const vw = x.measureText(st.value).width;
      setFont(x, 12 * s, 600, .72 * s); const lw = x.measureText(st.label.toUpperCase()).width;
      const room = limit - sx; if (room < 64 * s) break;
      x.fillStyle = T.muted; x.fillText(ellipsize(x, st.label.toUpperCase(), room), sx, footY + 14 * s);
      setFont(x, 16 * s, 650); x.fillStyle = T.text; x.fillText(ellipsize(x, st.value, room), sx, footY + 38 * s);
      sx += Math.min(Math.max(vw, lw), room) + 32 * s;
    }
  }

  // Panels.
  const bottom = footY - 32 * s;
  if (stacked) {
    let py = top;
    for (const p of [P.main, ...P.side]) {
      const large = p === P.main, ph = 76 * s + p.rows.length * (large ? 56 : 34) * s;
      drawRows(x, T, s, p.rows, drawPanel(x, T, s, pad, py, w - 2 * pad, ph, titleOf(p), noteOf(p)), large);
      py += ph + gap;
    }
    return;
  }
  const full = w - 2 * pad;
  const mainW = P.side.length ? (full - gap) * .6 : full;
  drawRows(x, T, s, P.main.rows, drawPanel(x, T, s, pad, top, mainW, bottom - top, titleOf(P.main), noteOf(P.main)), true);
  if (!P.side.length) return;
  const sx = pad + mainW + gap, sw = full - mainW - gap;
  const weights = P.side.map(p => p.rows.length + 1.6), total = weights.reduce((a, b) => a + b, 0);
  let py = top;
  P.side.forEach((p, i) => {
    const ph = i === P.side.length - 1 ? bottom - py : (bottom - top - gap * (P.side.length - 1)) * weights[i] / total;
    drawRows(x, T, s, p.rows, drawPanel(x, T, s, sx, py, sw, ph, titleOf(p), noteOf(p)), false);
    py += ph + gap;
  });
}

// ---- Page --------------------------------------------------------------

function paint(c, w, h, T, stacked, dpr) {
  c.width = Math.round(w * dpr); c.height = Math.round(h * dpr); c._dpr = dpr;
  drawDashboard(c, w, h, T, stacked);
}

function render() {
  const t = themeName(), T = THEMES[t];
  document.documentElement.dataset.theme = t;
  for (const b of $("theme").children) b.setAttribute("aria-pressed", String(b.dataset.v === t));
  $("hide").setAttribute("aria-pressed", String(hidden()));
  $("hide").textContent = hidden() ? "Names hidden" : "Hide names";
  if (!DATA) { $("meta").textContent = "No data. Run barton report to build this page."; return; }
  document.title = `Barton results · ${repoName()}`;
  const off = (DATA.excluded || []).length, few = (DATA.partial || []).length;
  $("meta").textContent = `${plural((DATA.tasks || []).length, "task")}${off ? ` (${off} faulty left off)` : ""}${few ? ` · ${plural(few, "setting")} with too few results left off` : ""} · built ${new Date(DATA.generated).toLocaleString()} · Barton-eval ${DATA.barton}`;
  const c = $("dash"), w = $("wrap").clientWidth - 32;
  const avail = innerHeight - $("wrap").getBoundingClientRect().top - 16 + scrollY;
  const stacked = w < 720 || w / avail < 1.2;
  const P = panelsOf();
  const h = stacked && P.main ? stackedHeight(w, P) : Math.max(320, Math.min(avail, w / 2));
  view = { w, h, stacked };
  c.style.height = h + "px";
  paint(c, w, h, T, stacked, devicePixelRatio || 1);
  if (P.main) c.setAttribute("aria-label", `${P.main.headline}. ${P.main.sub}`);
  renderTable();
}

// The image to share: the dashboard as shown, at least twice the screen's resolution and 2400 px wide.
let view = { w: 1200, h: 600, stacked: false };
function shareImage(cb) {
  const c = document.createElement("canvas");
  paint(c, view.w, view.h, THEMES[themeName()], view.stacked, Math.max(2, devicePixelRatio || 1, 2400 / view.w));
  c.toBlob(cb, "image/png");
}

function save(blob) {
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob);
  a.download = `barton-${hidden() ? "my-project" : DATA.repo}-${themeName()}.png`; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

function renderTable() {
  const res = DATA.results || [];
  const cols = [...new Set(res.map(r => `${r.model} · ${r.effort || "default"}`))];
  const t = $("tasks"); t.innerHTML = "";
  const head = document.createElement("tr");
  ["Task", ...cols].forEach(h => { const th = document.createElement("th"); th.textContent = h; head.appendChild(th); });
  t.appendChild(head);
  for (const task of DATA.tasks || []) {
    const tr = document.createElement("tr");
    const td = document.createElement("td");
    td.textContent = hidden() ? task.id : `${task.id}: ${(task.prompt || "").slice(0, 160)}${(task.prompt || "").length > 160 ? "…" : ""}`;
    const meta = document.createElement("small");
    const split = { all: "every setting made it", some: "told settings apart", none: "no setting made it" }[splitOf(task.id)];
    meta.textContent = `${task.kind === "write" ? "coding" : "review"} · ${task.source}${task.check ? " · checked" : ""}${split ? " · " + split : ""}`;
    td.appendChild(meta); tr.appendChild(td);
    for (const c of cols) {
      const cell = document.createElement("td");
      const rs = res.filter(r => r.task === task.id && `${r.model} · ${r.effort || "default"}` === c);
      if (!rs.length) cell.textContent = "–";
      rs.forEach((r, i) => {
        const span = document.createElement("span");
        span.className = ["solved", "found"].includes(r.outcome) ? "ok" : ["pending", "error"].includes(r.outcome) ? "wait" : "no";
        span.textContent = (i ? " " : "") + r.outcome; span.title = hidden() ? "" : r.judge_note || r.error || "";
        cell.appendChild(span);
      });
      tr.appendChild(cell);
    }
    t.appendChild(tr);
  }
  // Faulty tasks are left off the cards but stay listed, with the reason.
  for (const e of DATA.excluded || []) {
    const tr = document.createElement("tr"), td = document.createElement("td");
    td.textContent = e.id; td.colSpan = cols.length + 1;
    const meta = document.createElement("small");
    meta.textContent = hidden() ? "left off as a faulty task" : `left off as a faulty task: ${e.reason}`;
    td.appendChild(meta); tr.appendChild(td); t.appendChild(tr);
  }
}

$("handle").value = storeGet("barton-handle", "");
$("handle").addEventListener("input", () => { storeSet("barton-handle", $("handle").value); render(); });
for (const b of $("theme").children) b.addEventListener("click", () => { storeSet("barton-theme", b.dataset.v); render(); });
$("hide").addEventListener("click", () => { storeSet("barton-hide", hidden() ? "" : "1"); render(); });
$("copy").addEventListener("click", async () => {
  // The clipboard write starts inside the click, with the image as a promise; Safari
  // refuses a write that starts after the image is ready.
  const btn = $("copy"), png = new Promise(r => shareImage(r));
  try { await navigator.clipboard.write([new ClipboardItem({ "image/png": png })]); btn.textContent = "Copied"; }
  catch (e) { save(await png); btn.textContent = "Saved instead"; }
  setTimeout(() => btn.textContent = "Copy image", 2000);
});
$("save").addEventListener("click", () => shareImage(save));
let resizeTimer;
addEventListener("resize", () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(render, 60); });
render();
</script>
</body>
</html>
